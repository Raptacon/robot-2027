#
# Use this configuration file to control what RobotPy packages are installed
# on the robot controller (roboRIO on 2026, SystemCore on 2027)
#
# We support two RobotPy lines while 2027 is in alpha:
#   - 2026 (main): Python 3.14, requirements.txt, robotpy_version below
#   - 2027 alpha (preview): Python 3.15, requirements-2027.txt
# Deploying to SystemCore needs robotpy_version set to a 2027 release; switch
# it with `python -m robotpy project update-robotpy` once we move fully to 2027.
#

[tool.robotpy]

# Version of robotpy this project depends on
robotpy_version = "2026.2.2"

# Which extra RobotPy components should be installed
# -> equivalent to `pip install robotpy[extra1, ...]
components = [
    "all",
    #"apriltag",
    # "commands2",
    #"cscore",
    #"navx",
    #"pathplannerlib",
    #"phoenix5",
    #"phoenix6",
    #"playingwithfusion",
    #"rev",
    #"romi",
    #"sim",
]
# Other pip packages to install
# Must use python -m robotpy sync to install to cache
requires = [
    "numpy",
    "phoenix6",
    "robotpy-rev",
    "robotpy-navx",
    "robotpy-pathplannerlib",
    "pyyaml",
    "photonlibpy",
    "robotpy-urcl",
]

# Run each robot test in its own process. RobotPy 2026 reads this from pyfrc;
# RobotPy 2027 dropped pyfrc and reads [tool.robotpy.testing] below.
pyfrc.isolated = true

[tool.robotpy.testing]
isolated = true

[tool.pytest.ini_options]
# Exclude example directories from main test collection to avoid
# module name collisions (multiple pyfrc_test.py files)
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "graph: marks tests that generate graphs (run with '-m graph')",
]
addopts = "-m 'not graph'"

[tool.ruff]
line-length = 120
# Oldest Python either supported RobotPy line runs on (2027 needs 3.12+)
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
# Pyflakes (F), real errors (E4, E7, E9), and whitespace/escape warnings
# that flake8 used to catch. Style is handled by `ruff format`.
select = ["E4", "E7", "E9", "F", "W291", "W292", "W605"]
# Lambdas assigned to names are an accepted pattern in the input factory
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/pyfrc_test.py" = ["F403"]
"examples/**/tests/pyfrc_test.py" = ["F403"]
# Mocks wpilib before importing the module under test on purpose
"tests/test_virtual_analog.py" = ["E402"]

[tool.pyright]
include = ["robot.py", "commands", "config", "subsystem", "utils", "tests"]
exclude = ["**/__pycache__", "docs", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingModuleSource = false
