name: Raptacon (Team 3200) CI Pipeline

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'

jobs:
  RobotUnitTestLinux:
    name: Unit / Integration Tests (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      timeout-minutes: 2
      uses: actions/setup-python@v5
      with:
        python-version: 3.14.*

    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Robotpy tests with coverage
      timeout-minutes: 5
      run: |
        python -m robotpy coverage test
        python -m coverage xml -o coverage.xml
        python -m coverage report > coverage.txt

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: |
          coverage.xml
          coverage.txt
        if-no-files-found: ignore

    - name: Sim smoke test (headless, 5s)
      timeout-minutes: 1
      run: python .github/scripts/sim_smoke.py

  RobotUnitTestWindows:
    name: Unit / Integration Tests (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      timeout-minutes: 2
      uses: actions/setup-python@v5
      with:
        python-version: 3.14.*

    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Robotpy tests
      timeout-minutes: 5
      run: |
        python -m robotpy coverage test

  RobotUnitTestMacOS:
    name: Unit / Integration Tests (macOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      timeout-minutes: 2
      uses: actions/setup-python@v5
      with:
        python-version: 3.14.*

    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Robotpy tests
      timeout-minutes: 5
      run: |
        python -m robotpy coverage test

    - name: Sim smoke test (headless, 5s)
      timeout-minutes: 1
      run: python .github/scripts/sim_smoke.py

  RobotPy2027Preview:
    # Early warning for SystemCore / RobotPy 2027 breakage. Non-blocking:
    # vendor libraries may not have 2027 builds yet.
    name: RobotPy 2027 preview (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      timeout-minutes: 2
      uses: actions/setup-python@v5
      with:
        python-version: 3.14.*

    - name: Install RobotPy 2027 pre-release
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install --pre "robotpy[all]==2027.*" pyyaml
        pip install --pre "robotpy-rev==2027.*" "robotpy-navx==2027.*" "robotpy-urcl==2027.*" || echo "Some vendor 2027 packages are not available yet"
        pip freeze | grep -i -E "robotpy|wpilib|rev|navx|urcl"

    - name: Robotpy tests
      timeout-minutes: 5
      run: |
        python -m robotpy test

  StaticCritical:
    name: Critical Static Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      timeout-minutes: 2
      uses: actions/setup-python@v5
      with:
        python-version: 3.14.*

    - name: Lint with flake8 critical
      timeout-minutes: 1
      run: |
        pip install flake8
        # Rules come from .flake8 so local `make lint` and CI can't drift
        flake8 .

  ExtraStaticAnalysis:
    name: Extra Static Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      timeout-minutes: 2
      uses: actions/setup-python@v5
      with:
        python-version: 3.14.*

    - name: Lint with flake8 extra
      timeout-minutes: 1
      run: |
        pip install flake8
        # Non-blocking style report; excludes come from .flake8
        flake8 . --exit-zero --select=E,W,F,C90 --max-complexity=10 --max-line-length=127 --ignore=E265,E232,W391,E302,W293,W503

  BuildDocs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: [RobotUnitTestLinux, RobotUnitTestWindows, RobotUnitTestMacOS, StaticCritical]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      timeout-minutes: 2
      uses: actions/setup-python@v5
      with:
        python-version: 3.14.*

    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build documentation with pdoc
      timeout-minutes: 2
      run: |
        python3 doc/build_docs.py docs/

    - name: Upload docs artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/

  DeployDocs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [BuildDocs]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Download docs artifact
      uses: actions/download-artifact@v4
      with:
        name: documentation
        path: docs/

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
